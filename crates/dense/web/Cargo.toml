[package]
name = "crispmesh-dense-web"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Browser bindings (WebAssembly + WebGPU) of the CrispMesh dense pipeline"
publish = false

# Built for wasm32-unknown-unknown only; see build.sh. The native crate does not
# depend on anything here.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
console_error_panic_hook = "0.1"
crispmesh-dense = { path = ".." }
js-sys = "0.3"
serde_json = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
# Only the threaded package (build.sh threads): rayon's pool on Web Workers over shared memory.
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }

[features]
threads = ["dep:wasm-bindgen-rayon"]

[profile.release]
opt-level = 3
