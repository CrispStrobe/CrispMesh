[package]
name = "crispmesh-dense"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Native port of the CrispMesh all-view dense pipeline (reference implementation: scripts/turntable_mesh)"
publish = false

[lib]
name = "crispmesh_dense"
path = "src/lib.rs"

[[bin]]
name = "crispmesh-dense"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
web-time = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl", "webgpu"] }

# Free disk space before a run; there is no file system to ask in a browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs4 = "1.1"
# Drives the async GPU paths on a thread that may block.
pollster = "1"

# ONNX Runtime for the native SAM mask provider (src/photos/sam/onnx.rs), only with the feature `sam-onnx`.
# The runtime is a shared library loaded at run time: nothing is downloaded or linked when this crate is built.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ort]
version = "=2.0.0-rc.13"
optional = true
default-features = false
features = ["std", "load-dynamic", "api-20", "coreml"]

# Opening CrispEmbed's libcrispembed-sam2 for the SAM ggml backend (src/photos/sam/ggml.rs), only with the feature `sam-ggml`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.libloading]
version = "0.9"
optional = true

# Fetching the default SAM model on first use (src/photos/sam/fetch.rs), only with the feature `sam-onnx`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ureq]
version = "3.4"
optional = true
default-features = false
features = ["rustls"]

# Signalling the process group of an external tool (src/photos/process.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Optional neighboring-plane propagation is excluded from normal builds while
# its patent claim coverage is unresolved. This flag is not patent permission.
research-patchmatch = []
# The C interface of the run driver (src/capi.rs, include/crispmesh_dense.h).
capi = []
# The `sam` mask provider's ONNX backend: `--masks sam --sam-model DIR --sam-runtime libonnxruntime`.
sam-onnx = ["dep:ort", "dep:ureq"]
# The `sam` mask provider's ggml backend: CrispEmbed's libcrispembed-sam2, opened at run time, with a GGUF model.
sam-ggml = ["dep:libloading"]

[profile.release]
opt-level = 3
