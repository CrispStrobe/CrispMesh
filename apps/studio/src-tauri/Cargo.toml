[package]
name = "crispmesh-studio"
version = "0.2.0"
license = "AGPL-3.0-only"
description = "CrispMesh: watch a photo-to-STL reconstruction step by step"
authors = ["CrispMesh contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crispmesh_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The reconstruction itself, in this process: no Python, no child process.
crispmesh-dense = { path = "../../../crates/dense", optional = true }
anyhow = { version = "1", optional = true }

# Native pickers, and the token of the optional external Python engine, exist on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
getrandom = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# native-engine: the reconstruction runs inside the app (crates/dense, WebGPU through wgpu).
# local-engine:  desktop only; the app can also start the Python engine as a child process
#                ("External Python engine": the photos start and comparisons). Not possible
#                in the App Sandbox, so store builds use --no-default-features --features native-engine.
# Without either the app is a client: an engine elsewhere, recorded runs, the demo.
default = ["native-engine", "local-engine"]
native-engine = ["dep:crispmesh-dense", "dep:anyhow"]
local-engine = ["dep:getrandom"]

# The pipeline is far too slow unoptimised to try anything real in a debug build.
[profile.dev.package.crispmesh-dense]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
