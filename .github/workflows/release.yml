name: release

# Builds everything a CrispMesh release consists of and, on a tag, puts it into a
# DRAFT PRERELEASE on GitHub. Nothing is published without a person un-drafting it.
#
#   tag v1.2.3            -> version 1.2.3, artifacts, draft prerelease v1.2.3
#   workflow_dispatch     -> version 0.0.0-dev+<short sha>, artifacts only when
#                            dry_run is true (the default); with dry_run false a
#                            dispatch still creates no release unless it runs on a tag.
#
# Jobs
#   web      Studio's static bundle (relative URLs, demo recording inside), zipped.
#   desktop  The Studio Tauri app with the reconstruction engine (crates/dense) built
#            in, bundled: macOS arm64 (.dmg, .app.tar.gz), Windows x64 (NSIS setup
#            .exe), Linux x64 (AppImage, .deb).
#            Bundling is switched on only here, through src-tauri/tauri.release.conf.json;
#            tauri.conf.json keeps bundle.active=false for every other build.
#   android  Debug-signed APK (throwaway debug key). Non-blocking.
#   ios      Simulator .app, zipped. Not installable on a device. Non-blocking.
#   python   Source archive of the dense pipeline; its unit tests and the synthetic
#            end-to-end run are executed FROM THE UNPACKED ARCHIVE first.
#   publish  SHA256SUMS.txt over all files; on a tag, the draft prerelease.
#
# What these builds are NOT
#   - Not signed. macOS gets an ad-hoc signature only, so Gatekeeper will refuse
#     the app until the user allows it; Windows SmartScreen will warn.
#   - Not a photos-to-model app yet. The desktop app reconstructs by itself, without
#     Python, from photos whose cameras and masks already exist. Getting cameras and
#     masks from plain photos still needs external tools (the Python pipeline with
#     AliceVision and SAM); none of that is bundled.
#   - Not tested on Windows or Linux beyond building, and not on phones at all.
#   - Not GPU-tested for CUDA. CI has no GPU; --device mps and cuda are not run here.
#
# Signing (optional, off until the secrets exist; none are defined by this file)
#   macOS   APPLE_CERTIFICATE            base64 of a Developer ID Application .p12
#           APPLE_CERTIFICATE_PASSWORD   its password
#           APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
#           APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   for notarisation (app-specific password)
#   Windows WINDOWS_CERTIFICATE          base64 of a code-signing .pfx
#           WINDOWS_CERTIFICATE_PASSWORD its password
#   Android ANDROID_KEYSTORE (base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#           ANDROID_KEY_PASSWORD        not wired up: only a debug APK is built
#   iOS     an Apple Developer team, certificate and provisioning profile
#                                        not wired up: only a simulator build is made
#   The macOS and Windows steps below are written but have NEVER RUN with real
#   secrets; treat them as a starting point. See docs/RELEASING.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only build and upload workflow artifacts; create no release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  meta:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      file_version: ${{ steps.version.outputs.file_version }}
      mobile_version: ${{ steps.version.outputs.mobile_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            tag="$REF_NAME"
          else
            version="0.0.0-dev+${SHA:0:7}"
            tag=""
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-rc.1 (tag must be v<version>)"
            exit 1
          fi
          # '+' is awkward in file names and URLs; files use '-' instead.
          file_version="${version//+/-}"
          # Apple and Android accept plain numbers only, and Android refuses 0.0.0.
          mobile_version="${version%%[-+]*}"
          if [ "$mobile_version" = "0.0.0" ]; then mobile_version="0.0.1"; fi
          echo "mobile_version=$mobile_version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file_version=$file_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version $version (files: $file_version) tag '${tag:-none}'" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web bundle
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      FILE_VERSION: ${{ needs.meta.outputs.file_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The engine for "This browser": crates/dense/web as WebAssembly, copied into dist/engine
      # by the build. Without it the app still builds and that mode says it is not included.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crates/dense/web/target
            crates/dense/web/target-wasm-threads
          key: studio-wasm-${{ hashFiles('crates/dense/web/Cargo.lock') }}
      - name: Engine for browsers (WebAssembly)
        working-directory: crates/dense/web
        run: |
          rustup target add wasm32-unknown-unknown
          # The threaded package rebuilds the standard library with shared memory: it needs its source.
          rustup component add rust-src
          wasm-bindgen --version 2>/dev/null | grep -q ' 0\.2\.129$' || cargo install wasm-bindgen-cli --version 0.2.129 --locked
          sh build.sh
          sh build.sh threads
      # Build with the third-party notices inside (needs cargo, which the runner image has).
      - run: npm run build:release
      - name: Zip (one top-level folder, demo recording inside)
        run: |
          test -s dist/demo/events.jsonl
          test -s dist/THIRD-PARTY-NOTICES.txt
          test -s dist/engine/pkg/crispmesh_dense_web_bg.wasm
          ! grep -E '(src|href)="/' dist/index.html
          name="CrispMesh_web-$FILE_VERSION"
          mkdir -p ../../release-out && mv dist "$name"
          # The notices on their own as well: the license, the store permission and every third-party license.
          cp "$name/THIRD-PARTY-NOTICES.txt" ../../release-out/THIRD-PARTY-NOTICES.txt
          zip -qr "../../release-out/$name.zip" "$name"
          ls -la ../../release-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          if-no-files-found: error
          path: release-out/*

  desktop:
    name: desktop (${{ matrix.label }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
            bundles: app,dmg
          - os: windows-latest
            label: windows-x64
            bundles: nsis
          - os: ubuntu-latest
            label: linux-x64
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      FILE_VERSION: ${{ needs.meta.outputs.file_version }}
      LABEL: ${{ matrix.label }}
      # "true" only when the secret exists; steps below are skipped otherwise.
      HAVE_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAVE_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux system libraries for Tauri 2 and its bundlers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential pkg-config curl wget file xdg-utils libfuse2t64
      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: studio-release-${{ matrix.os }}-${{ hashFiles('apps/studio/src-tauri/Cargo.lock') }}
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm ci

      # ---- Signing: skipped unless the secrets exist. Never run with real secrets yet. ----
      - name: macOS signing and notarisation settings (only with APPLE_CERTIFICATE)
        if: runner.os == 'macOS' && env.HAVE_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The Tauri bundler reads these variables itself: it imports the certificate into a
          # temporary keychain, signs with the identity and, when APPLE_ID is set, notarises.
          # The identity from the environment replaces the ad-hoc "-" of tauri.release.conf.json.
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          fi
      - name: Windows code-signing certificate (only with WINDOWS_CERTIFICATE)
        if: runner.os == 'Windows' && env.HAVE_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Imports the .pfx into the user's store and tells the bundler which certificate to
          # use (thumbprint) through one more --config file picked up by the build step.
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 src-tauri/tauri.signing.conf.json
      # -------------------------------------------------------------------------------------

      - name: Build and bundle
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          # The cached target folder may hold bundles of an earlier version; only this build's count.
          rm -rf src-tauri/target/release/bundle
          extra=""
          if [ -f src-tauri/tauri.signing.conf.json ]; then extra="--config src-tauri/tauri.signing.conf.json"; fi
          # beforeBuildCommand runs `npm run build` (typecheck + Vite bundle) first.
          npx tauri build --ci --bundles "$BUNDLES" --config src-tauri/tauri.release.conf.json $extra -- --locked
      - name: Collect with release names
        run: |
          out="$GITHUB_WORKSPACE/release-out"
          mkdir -p "$out"
          bundle=src-tauri/target/release/bundle
          find "$bundle" -maxdepth 2 | sort
          base="CrispMesh_$FILE_VERSION-$LABEL"
          case "$RUNNER_OS" in
            macOS)
              cp "$bundle"/dmg/*.dmg "$out/$base.dmg"
              # tar keeps the bundle's symlinks, permissions and signature intact.
              tar -C "$bundle/macos" -czf "$out/$base.app.tar.gz" "CrispMesh.app"
              codesign --display --verbose=2 "$bundle/macos/CrispMesh.app" 2>&1 | grep -E 'Signature|Authority|TeamIdentifier' || true
              ;;
            Windows)
              cp "$bundle"/nsis/*-setup.exe "$out/$base-setup.exe"
              ;;
            Linux)
              cp "$bundle"/appimage/*.AppImage "$out/$base.AppImage"
              cp "$bundle"/deb/*.deb "$out/$base.deb"
              dpkg-deb --info "$out/$base.deb" | sed -n '1,25p'
              ;;
          esac
          ls -la "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.label }}
          if-no-files-found: error
          path: release-out/*

  android:
    name: android debug apk (non-blocking)
    needs: meta
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/studio
    env:
      VERSION: ${{ needs.meta.outputs.mobile_version }}
      FILE_VERSION: ${{ needs.meta.outputs.file_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Point Tauri at the preinstalled NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm ci
      - run: npx tauri android init --ci
      # Signed with the throwaway debug key Gradle creates: installable for testing, not for a store.
      - run: npx tauri android build --debug --apk --target aarch64 --ci
      - name: Collect
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-out"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$apk" "$GITHUB_WORKSPACE/release-out/CrispMesh_$FILE_VERSION-android-arm64-debug.apk"
          ls -la "$GITHUB_WORKSPACE/release-out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          if-no-files-found: error
          path: release-out/*

  ios:
    name: ios simulator build (non-blocking)
    needs: meta
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/studio
    env:
      VERSION: ${{ needs.meta.outputs.mobile_version }}
      FILE_VERSION: ${{ needs.meta.outputs.file_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - run: brew install xcodegen
      - run: node scripts/set-version.mjs "$VERSION"
      - run: npm ci
      - run: npx tauri ios init --ci
      # The privacy manifest becomes a resource of the app.
      - run: node scripts/ios-prepare.mjs
      - name: Unsigned simulator build
        run: npx tauri ios build --debug --target aarch64-sim --ci
      # Informational: shows whether src-tauri/Info.ios.plist reached the app
      # (export compliance, local networking), which App Store processing looks at.
      - name: Info.plist of the built app
        run: |
          app=$(find src-tauri/gen/apple/build -name '*.app' -maxdepth 6 | head -n 1)
          /usr/libexec/PlistBuddy -c Print "$app/Info.plist" \
            | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|ITSAppUsesNonExemptEncryption|NSAllowsLocalNetworking|NSLocalNetworkUsageDescription|arm64|armv7' || true
          ls "$app" | head -40
      - name: Collect
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-out"
          app=$(find src-tauri/gen/apple/build -name '*.app' -maxdepth 6 | head -n 1)
          test -n "$app"
          ditto -c -k --keepParent "$app" "$GITHUB_WORKSPACE/release-out/CrispMesh_$FILE_VERSION-ios-simulator-arm64.app.zip"
          ls -la "$GITHUB_WORKSPACE/release-out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ios
          if-no-files-found: error
          path: release-out/*

  python:
    name: dense pipeline source archive
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FILE_VERSION: ${{ needs.meta.outputs.file_version }}
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/turntable_mesh/requirements-dense.txt
      - name: Pack
        run: |
          name="crispmesh-dense-pipeline-$FILE_VERSION"
          mkdir -p release-out
          # scripts/turntable_mesh, the modules elsewhere under scripts/ that it imports (followed
          # through the sources, e.g. object_dataset/evaluate.py), the contract, the fixture, LICENSE.
          python apps/studio/scripts/pipeline-files.py > "$RUNNER_TEMP/files"
          test -s "$RUNNER_TEMP/files"
          grep -v -e '^scripts/turntable_mesh/' -e '^tests/fixtures/' "$RUNNER_TEMP/files"
          tar --files-from="$RUNNER_TEMP/files" --transform "s,^,$name/," --owner=0 --group=0 --numeric-owner \
            -czf "release-out/$name.tar.gz"
          tar -tzf "release-out/$name.tar.gz" | sed -n '1,12p'
          echo "files: $(tar -tzf "release-out/$name.tar.gz" | wc -l)"
          for needed in LICENSE docs/ENGINE-CONTRACT.md scripts/__init__.py scripts/turntable_mesh/requirements-dense.txt \
                        scripts/turntable_mesh/dense_pipeline.py tests/fixtures/dense-run-sphere/events.jsonl; do
            tar -tzf "release-out/$name.tar.gz" "$name/$needed" > /dev/null
          done
      - name: Unpack somewhere that is not the checkout
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -C "$RUNNER_TEMP/unpacked" -xzf release-out/crispmesh-dense-pipeline-$FILE_VERSION.tar.gz
          echo "ARCHIVE_ROOT=$RUNNER_TEMP/unpacked/crispmesh-dense-pipeline-$FILE_VERSION" >> "$GITHUB_ENV"
      # PyPI's Linux wheel bundles the CUDA runtime (several GiB); the CPU index keeps the job small.
      - name: Install requirements from the archive
        working-directory: ${{ env.ARCHIVE_ROOT }}
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/turntable_mesh/requirements-dense.txt
      - name: Unit tests, run from the unpacked archive
        working-directory: ${{ env.ARCHIVE_ROOT }}
        env:
          PYTHONPATH: ${{ env.ARCHIVE_ROOT }}
          CRISPMESH_TEST_ENGINE_RUN: '1'
        run: python -m unittest discover -v -s scripts/turntable_mesh -t . -p 'test_*.py'
      - name: Synthetic end-to-end run from the unpacked archive
        working-directory: ${{ env.ARCHIVE_ROOT }}
        env:
          PYTHONPATH: ${{ env.ARCHIVE_ROOT }}
        run: |
          python -m scripts.turntable_mesh.synthetic_scene --output "$RUNNER_TEMP/sphere"
          python -m scripts.turntable_mesh.dense_pipeline --inputs "$RUNNER_TEMP/sphere" --output "$RUNNER_TEMP/sphere-run" \
            --device cpu --set sizes=64,128 --set grid=96 --set planes=48 --set neighbours=4 --set best_of=2 \
            --set vote_neighbours=4 --set min_votes=2,2 --set crop_padding=6 --set hull_dilate=1 \
            --set windows=5,7 --set aggregates=1,1
          python - "$RUNNER_TEMP/sphere-run" <<'EOF'
          import json, sys
          from pathlib import Path
          run = Path(sys.argv[1])
          report = json.loads((run / "pipeline.json").read_text())
          mesh = json.loads((run / "mesh/result.json").read_text())
          events = [json.loads(line) for line in (run / "events.jsonl").read_text(encoding="utf-8").splitlines()]
          print(json.dumps({k: report.get(k) for k in ("status", "closed", "triangles", "genus", "seconds")}, indent=2))
          assert report["status"] == "complete", report["status"]
          assert mesh["closed"] is True, mesh
          assert (run / "mesh/mesh.stl").stat().st_size > 84
          assert events[0]["type"] == "run_started" and events[-1]["type"] == "run_finished" and events[-1]["status"] == "complete"
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-python
          if-no-files-found: error
          path: release-out/*

  publish:
    name: checksums and draft prerelease
    needs: [meta, web, desktop, python, android, ios]
    # Mobile is non-blocking: go ahead when the required jobs are green.
    if: always() && needs.web.result == 'success' && needs.desktop.result == 'success' && needs.python.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums
        working-directory: release
        run: |
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          { echo '### Files'; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: docs/release-notes.md
          path: source
      - name: Release notes (docs/release-notes.md)
        run: |
          sed "s/{VERSION}/$VERSION/g" source/docs/release-notes.md > notes.md
          cat notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-all
          if-no-files-found: error
          path: |
            release/*
            notes.md
      - name: Draft prerelease (tags only, never on a dry run)
        if: needs.meta.outputs.tag != '' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* --draft --prerelease --verify-tag \
            --title "CrispMesh $VERSION" --notes-file notes.md --generate-notes
      - name: Nothing was released
        if: needs.meta.outputs.tag == '' || env.DRY_RUN == 'true'
        run: echo "No release was created (dry run, or not a tag). The files are in the release-all artifact." >> "$GITHUB_STEP_SUMMARY"
