name: studio

# CrispMesh (apps/studio): the web front end and its Tauri 2 shell.
#
#   web      typecheck, unit tests and the static bundle (artifact). Built with
#            relative asset URLs, so it can be served from any path. The bundle
#            carries the engine for browsers (crates/dense/web as WebAssembly,
#            built here); it is only built, not run: the runners have no WebGPU.
#   native   the desktop shell on macOS, Windows and Linux with the reconstruction
#            engine (crates/dense) linked in: Rust unit tests, then a release build
#            WITHOUT installer bundling (tauri.conf.json has bundle.active=false and
#            --no-bundle is passed as well). The artifact is the bare, unsigned
#            executable; it reconstructs by itself and contains no Python.
#            The tests include one real run started the way the app starts it. The
#            runners have no GPU that wgpu accepts everywhere, so that run either
#            completes or must fail cleanly (error + run_finished); both pass.
#            A change to the dependencies of crates/dense needs
#            `cargo update -p crispmesh-dense` in apps/studio/src-tauri (the build
#            uses --locked), which is why crates/dense is among the paths.
#   android, ios
#            manual only (workflow_dispatch with mobile=true), non-blocking,
#            unsigned: a debug APK and a simulator .app, with the engine compiled
#            in. Whether it runs on a phone is untested: nothing is installed or
#            launched.
#
# Nothing is deployed or released from here; see release.yml for that.

on:
  workflow_dispatch:
    inputs:
      mobile:
        description: 'Also try the unsigned Android and iOS builds'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/studio.yml'
      - 'apps/studio/**'
      - 'crates/dense/**'
      - 'tests/fixtures/dense-run-sphere/**'
      - 'tests/fixtures/dense-config-defaults.json'
      - 'docs/ENGINE-CONTRACT.md'
  pull_request:
    paths:
      - '.github/workflows/studio.yml'
      - 'apps/studio/**'
      - 'crates/dense/**'
      - 'tests/fixtures/dense-run-sphere/**'
      - 'tests/fixtures/dense-config-defaults.json'
      - 'docs/ENGINE-CONTRACT.md'

permissions:
  contents: read

concurrency:
  group: studio-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  # On main every commit keeps its own run: pushes to crates/dense arrive often, and a
  # cancelled run reads like a failure. The event is in the group so that a manual run
  # (for the mobile builds) does not cancel the push's run of the same commit.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  web:
    name: lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The engine for "This browser": crates/dense/web as WebAssembly, copied into dist/engine
      # by the build. Without it the app still builds and that mode says it is not included.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            crates/dense/web/target
            crates/dense/web/target-wasm-threads
          key: studio-wasm-${{ hashFiles('crates/dense/web/Cargo.lock') }}
      - name: Engine for browsers (WebAssembly)
        working-directory: crates/dense/web
        run: |
          rustup target add wasm32-unknown-unknown
          # The threaded package rebuilds the standard library with shared memory: it needs its source.
          rustup component add rust-src
          wasm-bindgen --version 2>/dev/null | grep -q ' 0\.2\.129$' || cargo install wasm-bindgen-cli --version 0.2.129 --locked
          sh build.sh
          sh build.sh threads
      - run: npm run build
      # Fails on a license outside the policy (GPL, AGPL, LGPL, unknown from third parties)
      # and when docs/licenses.json or docs/THIRD-PARTY-LICENSES.md are out of date.
      - name: License audit of what the app ships
        run: npm run licenses -- --check
      - name: The bundle carries the demo recording and only relative URLs
        run: |
          test -s dist/demo/events.jsonl
          test -s dist/demo/mesh/mesh.stl
          test -s dist/engine/crispmesh-dense.js
          test -s dist/engine/pkg/crispmesh_dense_web_bg.wasm
          test -s dist/engine/pkg-threads/crispmesh_dense_web_bg.wasm
          test -s dist/coi-worker.js
          ! grep -E '(src|href)="/' dist/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crispmesh-studio
          if-no-files-found: error
          path: apps/studio/dist

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Tauri 2 on Linux links WebKitGTK 4.1 (not 4.0) and friends.
      - name: Linux system libraries for Tauri 2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential pkg-config curl wget file
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/studio/src-tauri/target
          key: studio-tauri-${{ matrix.os }}-${{ hashFiles('apps/studio/src-tauri/Cargo.lock') }}
      - run: npm ci
      # The shell embeds dist/ at compile time, so the web bundle comes first.
      - run: npm run build
      - name: Shell unit tests (paths, run listing, event paging, cancel, one real run, Python launcher)
        working-directory: apps/studio/src-tauri
        run: cargo test --locked -- --nocapture
      - name: Tauri release build, no installer bundle
        run: npx tauri build --no-bundle --ci -- --locked
      - name: List build output
        run: ls -la src-tauri/target/release | head -40
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crispmesh-studio-${{ matrix.os }}-unsigned
          if-no-files-found: error
          path: |
            apps/studio/src-tauri/target/release/crispmesh-studio
            apps/studio/src-tauri/target/release/crispmesh-studio.exe

  # Mobile: manual, non-blocking, unsigned. The generated projects
  # (src-tauri/gen/) are git-ignored, so each run starts with `tauri <os> init`.
  # A release needs signing material that is not in this repository: see the
  # comments in release.yml and apps/studio/README.md.
  android:
    name: android debug apk (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-linux-android
      # The hosted image ships the Android SDK and NDK; Tauri reads NDK_HOME.
      - name: Point Tauri at the preinstalled NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android init --ci
      - run: npx tauri android build --debug --apk --target aarch64 --ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crispmesh-studio-android-debug-apk
          if-no-files-found: error
          path: apps/studio/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    name: ios simulator build (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - run: brew install xcodegen
      - run: npm ci
      - run: npx tauri ios init --ci
      # The privacy manifest becomes a resource of the app.
      - run: node scripts/ios-prepare.mjs
      - name: Unsigned simulator build
        run: npx tauri ios build --debug --target aarch64-sim --ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crispmesh-studio-ios-simulator
          if-no-files-found: warn
          path: |
            apps/studio/src-tauri/gen/apple/build/**/*.app
            apps/studio/src-tauri/gen/apple/build/**/*.ipa
