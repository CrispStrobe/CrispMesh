name: app checks

# Runs the apps the stores get, the way a person would, and photographs them:
#
#   ios     the iOS app (debug simulator build) on an iPhone 6.9" and an iPad 13" simulator:
#           installs it, starts the synthetic sphere through the app's own New run form,
#           waits for it to complete, takes simulator screenshots of the run, the 3D view,
#           the sheets, the runs list and the New run form.
#   macos   the Mac App Store variant (sandboxed, native engine only), launched in the App
#           Sandbox with the store's sandbox entitlements: the same run, photographed by its
#           own window id.
#   shots   App Store screenshots at Apple's sizes from those captures (iPhone 6.9",
#           iPad 13", Mac 2880x1800), and a dry run of uploading them to the 0.2.0 versions.
#           The real upload needs upload_screenshots=true on a manual run; the listing is
#           public once a version is submitted.
#
# Each job fails when the run does not complete or a screenshot is blank (too little
# variation: a window that never rendered). The scene is the synthetic sphere, the project's
# own data. Debug builds: the in-app driver (scripts/autopilot-run.js) only exists there.

on:
  workflow_dispatch:
    inputs:
      scene:
        description: 'What the apps reconstruct (and the screenshots show): the synthetic sphere, or the rendered rhino figurine (example object, downloaded from its dataset)'
        type: choice
        options: [sphere, rhino]
        default: sphere
      upload_screenshots:
        description: 'Replace the App Store screenshot sets of the 0.2.0 versions (otherwise a dry run)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # The rhino's recovered turntable frame has its upright direction along -Y.
  # Use the viewer's own Up control before photographing it.
  STUDIO_UP: ${{ inputs.scene == 'rhino' && '-Y' || '+Y' }}

jobs:
  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          xcodebuild -version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/studio/src-tauri/target
            crates/dense/target
          key: app-checks-ios-${{ hashFiles('apps/studio/src-tauri/Cargo.lock', 'crates/dense/Cargo.lock') }}
      - run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: npm ci
      - name: The scene (the synthetic sphere, or the rhino's photos from its dataset)
        env:
          SCENE: ${{ inputs.scene || 'sphere' }}
        run: |
          if [ "$SCENE" = rhino ]; then
            python scripts/ci/fetch-example.py https://huggingface.co/datasets/cstr/gso-turntable-photos/resolve/main/manifest.json rhino "$RUNNER_TEMP/rhino"
            echo "SCENE_DIR=$RUNNER_TEMP/rhino" >> "$GITHUB_ENV"
          else
            (cd ../../crates/dense && cargo run --release --locked --bin crispmesh-dense -- synthetic --output "$RUNNER_TEMP/sphere")
            echo "SCENE_DIR=$RUNNER_TEMP/sphere" >> "$GITHUB_ENV"
          fi
      - name: Simulator build (debug)
        run: |
          npx tauri ios init --ci
          node scripts/ios-prepare.mjs
          npx tauri ios build --debug --target aarch64-sim --ci
          app=$(find src-tauri/gen/apple/build -name '*.app' -maxdepth 3 | head -n 1)
          test -n "$app"
          echo "APP=$PWD/$app" >> "$GITHUB_ENV"
      - name: iPhone 6.9"
        run: sh scripts/ci/ios-sim-check.sh "$APP" "Pro Max" "$SCENE_DIR" "$GITHUB_WORKSPACE/checks"
      - name: iPad 13"
        run: sh scripts/ci/ios-sim-check.sh "$APP" "iPad Pro 13" "$SCENE_DIR" "$GITHUB_WORKSPACE/checks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: checks-ios
          path: checks/*.png
          if-no-files-found: warn

  macos:
    name: Mac App Store variant
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/studio/src-tauri/target
            crates/dense/target
          key: app-checks-macos-${{ hashFiles('apps/studio/src-tauri/Cargo.lock', 'crates/dense/Cargo.lock') }}
      - run: npm ci
      - name: The scene (the synthetic sphere, or the rhino's photos from its dataset)
        env:
          SCENE: ${{ inputs.scene || 'sphere' }}
        run: |
          if [ "$SCENE" = rhino ]; then
            python scripts/ci/fetch-example.py https://huggingface.co/datasets/cstr/gso-turntable-photos/resolve/main/manifest.json rhino "$RUNNER_TEMP/rhino"
            echo "SCENE_DIR=$RUNNER_TEMP/rhino" >> "$GITHUB_ENV"
          else
            (cd ../../crates/dense && cargo run --release --locked --bin crispmesh-dense -- synthetic --output "$RUNNER_TEMP/sphere")
            echo "SCENE_DIR=$RUNNER_TEMP/sphere" >> "$GITHUB_ENV"
          fi
      - name: Store variant (debug, sandboxed edition)
        run: npx tauri build --debug --no-bundle --ci --config src-tauri/tauri.appstore.conf.json -- --no-default-features --features native-engine --locked
      - name: Launch in the App Sandbox, run, photograph the window
        run: sh scripts/ci/mac-check.sh src-tauri/target/debug/crispmesh-studio "$SCENE_DIR" "$GITHUB_WORKSPACE/checks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: checks-macos
          path: checks/*.png
          if-no-files-found: warn

  shots:
    name: App Store screenshots
    needs: [ios, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow cryptography
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: checks-*
          merge-multiple: true
          path: checks
      - name: Screenshots at Apple's sizes
        run: python scripts/ci/appstore-shots.py ../../checks ../../appstore-shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appstore-screenshots
          path: appstore-shots
          if-no-files-found: error
      - name: Upload plan (dry run)
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: python scripts/ci/asc-screenshots.py ../../appstore-shots --version 0.2.0
      - name: Replace the screenshot sets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_screenshots }}
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: python scripts/ci/asc-screenshots.py ../../appstore-shots --version 0.2.0 --apply
