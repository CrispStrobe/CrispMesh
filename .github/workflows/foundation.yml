name: foundation

on:
  push:
  pull_request:

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os == 'macOS'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - name: Install pinned Python test dependencies
        if: runner.os == 'macOS'
        run: python3 -m pip install numpy==1.26.4 Pillow==12.0.0 pycolmap==3.11.1 opencv-python-headless==4.10.0.84
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: runner.os == 'macOS'
        with:
          toolchain: stable
      - name: Native core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          ctest --test-dir build --build-config Release --output-on-failure
      - name: Pinned OpenCV backend
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-opencv -DCMAKE_BUILD_TYPE=Release -DCRISPMESH_WITH_OPENCV=ON
          cmake --build build-opencv --config Release --parallel 4
          ctest --test-dir build-opencv --build-config Release --output-on-failure
      - name: Stereo evaluator CLI regression
        if: runner.os == 'macOS'
        run: CRISPMESH_TEST_STEREO_EVAL=1 python3 -m unittest scripts/test_stereo_eval_cli.py
      - name: Desktop web
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Shared contract parity
        if: runner.os == 'macOS'
        run: node tests/contract-parity.mjs build/crispmesh
      - name: Locked dependency inventory
        if: runner.os == 'macOS'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_dependencies.py
      - name: Tauri host compile
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
