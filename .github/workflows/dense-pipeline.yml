name: dense pipeline

# CPU checks of the all-view dense turntable pipeline (scripts/turntable_mesh):
# lint, analytic unit tests, the HTTP engine and the README "Quick start" on the synthetic sphere.
# Hosted runners have no usable GPU, so --device mps and --device cuda are not
# exercised here. See docs/CI.md.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dense-pipeline.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/dense-pipeline.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  dense:
    name: dense (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/turntable_mesh/requirements-dense.txt
      - name: Confirm Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      # PyPI's Linux wheel bundles the CUDA runtime (several GiB). The CPU index
      # keeps the job small; the macOS arm64 wheel on PyPI is already CPU/MPS only.
      - name: Install CPU Torch (Linux and Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install pipeline requirements
        run: python -m pip install -r scripts/turntable_mesh/requirements-dense.txt ruff==0.15.7
      - name: Versions
        run: |
          python -c "import numpy, scipy, skimage, cv2, PIL, torch; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'skimage', skimage.__version__, 'cv2', cv2.__version__, 'pillow', PIL.__version__, 'torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'mps', torch.backends.mps.is_available())"
      # The repository has no Ruff configuration. Ruff 0.16 widened its default
      # rule set (import sorting, RUF and others), so the version is pinned and
      # the rules the code was written against are named explicitly.
      - name: Lint
        run: ruff check --select E4,E7,E9,F scripts/turntable_mesh
      - name: Unit tests
        run: >
          python -m unittest -v
          scripts.turntable_mesh.test_multiscale_stereo
          scripts.turntable_mesh.test_tsdf_hull_mesh
          scripts.turntable_mesh.test_turntable_rig
          scripts.turntable_mesh.test_scan_evaluate
          scripts.turntable_mesh.test_dense_pipeline
          scripts.turntable_mesh.test_engine_server
          scripts.turntable_mesh.test_photos_to_inputs
          scripts.turntable_mesh.test_segment
          scripts.turntable_mesh.test_silhouette_cleanup
          scripts.turntable_mesh.test_alicevision_cameras
        env:
          # also start one real run through POST /api/runs of the HTTP engine
          CRISPMESH_TEST_ENGINE_RUN: '1'
      # Same commands as the "Quick start" of scripts/turntable_mesh/README.md,
      # with the output under the workspace instead of /tmp.
      - name: End-to-end smoke on the synthetic sphere
        run: |
          python -m scripts.turntable_mesh.synthetic_scene --output ci-out/sphere
          python -m scripts.turntable_mesh.dense_pipeline --inputs ci-out/sphere --output ci-out/sphere-run \
            --device cpu --set sizes=64,128 --set grid=96 --set planes=48 --set neighbours=4 --set best_of=2 \
            --set vote_neighbours=4 --set min_votes=2,2 --set crop_padding=6 --set hull_dilate=1 \
            --set windows=5,7 --set aggregates=1,1
      - name: Smoke result is a complete, closed mesh
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          run = Path("ci-out/sphere-run")
          report = json.loads((run / "pipeline.json").read_text())
          mesh = json.loads((run / "mesh/result.json").read_text())
          print(json.dumps({k: report.get(k) for k in ("status", "closed", "triangles", "genus", "seconds")}, indent=2))
          assert report["status"] == "complete", report["status"]
          assert mesh["closed"] is True, mesh
          assert (run / "mesh/mesh.stl").stat().st_size > 84
          assert (run / "check/preview.png").stat().st_size > 0
          events = [json.loads(line) for line in (run / "events.jsonl").read_text(encoding="utf-8").splitlines()]
          assert events[0]["type"] == "run_started" and events[-1]["type"] == "run_finished", events[-1]
          assert events[-1]["status"] == "complete", events[-1]
          previews = [e["path"] for e in events if e["type"] == "artifact" and e["kind"] == "preview_mesh"]
          print("live preview meshes:", previews)
          assert previews, "the live-preview side processes produced no mesh"
          assert all((run / path).is_file() for path in previews), previews
          EOF
      - name: Stage logs
        if: always()
        run: |
          for log in ci-out/sphere-run/*.log ci-out/sphere-run/stereo/preview/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"; tail -n 60 "$log"; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dense-smoke-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            ci-out/sphere-run/check/preview.png
            ci-out/sphere-run/check/result.json
            ci-out/sphere-run/pipeline.json
            ci-out/sphere-run/mesh/result.json
            ci-out/sphere-run/config.json
            ci-out/sphere-run/events.jsonl
            ci-out/sphere-run/*.log
            ci-out/sphere-run/stereo/preview/*.log
