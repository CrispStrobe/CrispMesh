name: dense native

# The Rust port of the dense pipeline (crates/dense): formatting, lints and unit tests.
# The tests need no GPU and no Python; reference values from SciPy are committed
# under tests/fixtures/dense-native.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dense-native.yml'
      - 'crates/dense/**'
      - 'tests/fixtures/dense-config-defaults.json'
      - 'tests/fixtures/dense-native/**'
  pull_request:
    paths:
      - '.github/workflows/dense-native.yml'
      - 'crates/dense/**'
      - 'tests/fixtures/dense-config-defaults.json'
      - 'tests/fixtures/dense-native/**'

permissions:
  contents: read

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: crates/dense
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The hosted images ship rustup; make sure the stable toolchain has both components.
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          rustc --version && cargo --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/dense/target
          key: dense-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dense/Cargo.lock') }}
          restore-keys: |
            dense-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --features capi -- -D warnings
      - name: Test
        run: cargo test --locked --features capi
      - name: Command line smoke
        run: |
          cargo run --locked --quiet -- --version
          cargo run --locked --quiet -- mesh --help
          cargo run --locked --quiet -- run --describe
          cargo run --locked --quiet -- settings --schema > /dev/null
      # Studio links this crate and builds with its own lockfile. A dependency change here
      # that the lockfile does not cover fails this step: update apps/studio/src-tauri/Cargo.lock
      # (cargo update -p crispmesh-dense --manifest-path apps/studio/src-tauri/Cargo.toml) in the same change.
      - name: Studio lockfile still resolves
        if: runner.os == 'Linux'
        run: cargo fetch --locked --manifest-path ../../apps/studio/src-tauri/Cargo.toml

  # The GPU kernels and the whole pipeline on a software WebGPU adapter: Mesa's
  # lavapipe (Vulkan) on Linux, WARP (DirectX 12) on Windows. Evidence that the
  # kernels are not tied to Metal. Software rasterisers on shared runners are
  # slow and occasionally unavailable, so this job does not block.
  software-gpu:
    name: GPU tests, software adapter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: crates/dense
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CRISPMESH_GPU_TESTS: '1'
      CRISPMESH_GPU_FALLBACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Mesa lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/dense/target
          key: dense-native-gpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dense/Cargo.lock') }}
          restore-keys: |
            dense-native-gpu-${{ runner.os }}-${{ runner.arch }}-
      - name: Adapter
        run: cargo test --locked --release -- gpu::tests::adapter --nocapture
      - name: GPU tests
        run: cargo test --locked --release -- gpu_ --test-threads 1

  # The whole chain from photos with the real COLMAP executable of the distribution:
  # a synthetic capture (textured sphere, mildly distorting lens, known orbit), threshold
  # masks, COLMAP cameras with the declared lens fixed, the dense stages on Mesa's software
  # Vulkan, then a check of the recovered orbit and the mesh. Does not block yet.
  colmap:
    name: photos with the COLMAP executable
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: crates/dense
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CRISPMESH_GPU_FALLBACK: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: COLMAP and Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends colmap mesa-vulkan-drivers libvulkan1
          colmap help | head -3 || true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/dense/target
          key: dense-native-gpu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dense/Cargo.lock') }}
          restore-keys: |
            dense-native-gpu-${{ runner.os }}-${{ runner.arch }}-
      - name: Build
        run: cargo build --locked --release
      - name: Synthetic capture
        run: ./target/release/crispmesh-dense synthetic --capture --output capture
      - name: Photos to mesh with COLMAP cameras
        run: >
          ./target/release/crispmesh-dense run --output run --photos capture/photos --calibration capture/lens.json
          --masks threshold --cameras colmap --threads 4 --minimum-free-gib 2
          --set sizes=128,256 --set grid=128
      - name: Recovered orbit and mesh
        run: ./target/release/crispmesh-dense synthetic --verify run --truth capture
      - name: Reports
        if: always()
        run: |
          cat run/frontend/frontend.json 2>/dev/null | head -80 || true
          tail -n 30 run/frontend/logs/*.log 2>/dev/null || true
          cat run/pipeline.json 2>/dev/null | head -60 || true

  # The library for wasm32, the browser package, and the test page in headless
  # Chromium on a software WebGPU adapter (SwiftShader). Does not block: WebGPU
  # in headless Chromium on a runner without a GPU is not dependable.
  wasm:
    name: wasm32 library check and browser test
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: crates/dense
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/wasm-bindgen
            crates/dense/target
            crates/dense/web/target
          key: dense-wasm-${{ runner.os }}-${{ hashFiles('crates/dense/Cargo.lock', 'crates/dense/web/Cargo.lock') }}
          restore-keys: |
            dense-wasm-${{ runner.os }}-
      - name: Library check
        run: cargo check --locked --lib --target wasm32-unknown-unknown
      - name: Bindings lint
        working-directory: crates/dense/web
        run: |
          cargo fmt --check
          cargo clippy --locked --release --target wasm32-unknown-unknown -- -D warnings
      - name: wasm-bindgen
        run: command -v wasm-bindgen || cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Package
        working-directory: crates/dense/web
        run: sh build.sh
      - name: Synthetic scene
        run: cargo run --locked --quiet -- synthetic --output web/scene
      - name: Chromium
        working-directory: crates/dense/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser test (software WebGPU)
        working-directory: crates/dense/web
        run: >
          node test/run.mjs --scene scene --output browser-run --software --timeout 900
          --options '{"overrides":["sizes=64,128","grid=96","planes=48","neighbours=4","best_of=2","vote_neighbours=4","min_votes=2,2","crop_padding=6","hull_dilate=1","windows=5,7","aggregates=1,1"]}'
