[package]
name = "crispmesh-foreground-capture"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "foreground-capture"
path = "../../scripts/photo_regression/foreground_capture.rs"

# Reuse the actual app foreground implementation without building Tauri's
# static library or bundling a second segmentation model.
[target.'cfg(target_os = "macos")'.dependencies]
crispmesh-dense = { path = "../../crates/dense" }
objc2 = { version = "0.6", features = ["exception"] }
serde_json = "1"

[profile.release]
opt-level = 3
